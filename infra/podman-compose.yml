version: "3.8"

services:
  homeguard:
    build:
      context: ..
      dockerfile: infra/Containerfile
    image: homeguard:latest
    container_name: homeguard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - homeguard-data:/app/data
      - homeguard-blobs:/app/blobs
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/homeguard.db"
      Blob__LocalPath: "/app/blobs"
      Fido2__ServerDomain: "192.168.1.100"
      Fido2__Origins__0: "http://192.168.1.100:8080"
      # Заменить на реальный IP твоей машины.
      # Или использовать .env файл (см. ниже).

volumes:
  homeguard-data:
  homeguard-blobs:
