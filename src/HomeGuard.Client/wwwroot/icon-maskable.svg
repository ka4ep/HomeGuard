<!-- Maskable / apple-touch source: same mark as icon.svg, but full-bleed and opaque.
     Android crops maskable icons to an arbitrary shape (up to 20% off each edge) and
     iOS composites apple-touch-icon on an opaque background, so this variant has no
     rounded corners and no transparency. The mark stays inside the 80% safe circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eeeae4"/>
      <stop offset="100%" stop-color="#ddd9d2"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7db0"/>
      <stop offset="100%" stop-color="#3a5278"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Shield body -->
  <path d="M256 96 L352 136 L352 248 C352 308 312 356 256 376
           C200 356 160 308 160 248 L160 136 Z"
        fill="url(#shield-fill)"/>

  <!-- Shield highlight -->
  <path d="M256 112 L340 148 L340 248 C340 302 304 346 256 364"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

  <!-- House silhouette inside shield (white) -->
  <polygon points="256,172 306,212 206,212" fill="white" opacity="0.95"/>
  <rect x="238" y="242" width="36" height="40" rx="18" fill="white" opacity="0.95"/>
  <rect x="210" y="212" width="92" height="72" fill="white" opacity="0.95"/>
  <rect x="238" y="262" width="36" height="22" fill="url(#shield-fill)"/>
  <rect x="218" y="224" width="22" height="20" rx="4" fill="url(#shield-fill)" opacity="0.7"/>
  <rect x="272" y="224" width="22" height="20" rx="4" fill="url(#shield-fill)" opacity="0.7"/>

  <!-- Checkmark at bottom of shield -->
  <polyline points="232,316 248,332 280,300"
            fill="none" stroke="white" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
