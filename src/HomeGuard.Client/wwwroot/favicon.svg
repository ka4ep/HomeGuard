<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eeeae4"/>
      <stop offset="100%" stop-color="#ddd9d2"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7db0"/>
      <stop offset="100%" stop-color="#3a5278"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M16 5 L25 8.5 L25 16.5 C25 21 21 24.5 16 26
           C11 24.5 7 21 7 16.5 L7 8.5 Z"
        fill="url(#sh)"/>

  <!-- House roof -->
  <polygon points="16,10.5 20.5,14 11.5,14" fill="white" opacity="0.95"/>
  <!-- House walls -->
  <rect x="12" y="14" width="8" height="6" fill="white" opacity="0.95"/>
  <!-- Door -->
  <rect x="14.5" y="17" width="3" height="3" rx="1.5" fill="url(#sh)"/>

  <!-- Tick -->
  <polyline points="11,21 13.5,23.5 21,17.5"
            fill="none" stroke="white" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
